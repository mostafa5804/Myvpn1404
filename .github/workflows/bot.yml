name: Dual Session VPN Bot

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4 # 🟢 آپدیت شد به نسخه ۴
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # دریافت کامل تاریخچه برای جلوگیری از مشکلات مرج

    - name: Setup Python
      uses: actions/setup-python@v5 # 🟢 آپدیت شد به نسخه ۵
      with:
        python-version: '3.10'

    - name: Install deps
      run: pip install telethon jdatetime pytz requests

    - name: Run bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
        SESSION_STRING_2: ${{ secrets.SESSION_STRING_2 }}
      run: python main.py

    - name: Check & Push Changes
      run: |
        git config --global user.name "VPN Bot"
        git config --global user.email "bot@github.com"
        
        # بررسی فایل‌های حیاتی
        if [ ! -f "index.html" ]; then
          echo "Error: index.html was not generated!"
          exit 1
        fi

        # افزودن فایل‌ها
        git add index.html data.json sub.txt manifest.json sw.js
        
        # کامیت کردن تغییرات
        git commit -m "🔄 Auto-Update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        
        # دریافت تغییرات جدید سرور و حل تضادها با اولویت فایل‌های ربات
        git pull --rebase -Xours origin main
        
        # ارسال نهایی
        git push origin HEAD:main
