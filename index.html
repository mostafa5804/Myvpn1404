<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Hub Premium 2026</title>
    <meta name="theme-color" content="#f0f9ff">
    
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }

        }
    </script>
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            font-weight: 800;
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        .sort-btn.active {
            background-color: #e2e8f0;
            color: #3b82f6;
            border-color: #3b82f6;
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        .live-dot {
            animation: pulse-glow 2s infinite;
        }
        
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgba(59, 130, 246, 0.2);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col pb-24 selection:bg-primary-500/30 selection:text-primary-700">
    
    <!-- Header -->
    <header class="fixed top-0 w-full bg-white/80 backdrop-blur-xl border-b border-gray-200 z-40 transition-all duration-300">

    <!-- Main Content -->
    <main class="max-w-xl mx-auto w-full pt-20 px-4 flex-grow">
        
        <!-- Search & Filter Section -->
        <div class="sticky top-16 bg-white/80 backdrop-blur-md z-30 py-4 -mx-4 px-4 border-b border-gray-200 mb-4 space-y-3.5">

            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">

                <button onclick="filterType('VLESS', this)" class="filter-btn flex-shrink-0 bg-slate-50 text-slate-600 px-5 py-2 rounded-full text-xs border border-slate-200 transition-all">VLESS</button>
                <button onclick="filterType('VMESS', this)" class="filter-btn flex-shrink-0 bg-slate-50 text-slate-600 px-5 py-2 rounded-full text-xs border border-slate-200 transition-all">VMess</button>
                <button onclick="filterType('TROJAN', this)" class="filter-btn flex-shrink-0 bg-slate-50 text-slate-600 px-5 py-2 rounded-full text-xs border border-slate-200 transition-all">Trojan</button>
                <button onclick="filterType('MTPROXY', this)" class="filter-btn flex-shrink-0 bg-slate-50 text-slate-600 px-5 py-2 rounded-full text-xs border border-slate-200 transition-all">MTProxy</button>
                <button onclick="filterType('FILES', this)" class="filter-btn flex-shrink-0 bg-slate-50 text-slate-600 px-5 py-2 rounded-full text-xs border border-slate-200 transition-all">فایل‌ها (NPVT)</button>
            </div>

            <div class="flex items-center justify-between pt-1 gap-4">
                <div class="flex gap-1.5 bg-slate-50/60 p-0.5 rounded-lg border border-slate-200">
                    <button onclick="changeSort('date', this)" class="sort-btn active px-3 py-1.5 rounded-md text-[11px] font-medium text-slate-600 border border-transparent transition-all">
                        <i class="fas fa-clock pl-1"></i>جدیدترین
                    </button>
                    <button onclick="changeSort('ping', this)" class="sort-btn px-3 py-1.5 rounded-md text-[11px] font-medium text-slate-600 border border-transparent transition-all">
                        <i class="fas fa-bolt pl-1"></i>کمترین پینگ

                </div>
                
                <button onclick="copyAllVisible()" id="copyAllBtn" class="bg-primary-50 hover:bg-primary-100 text-primary-700 border border-primary-200 px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center gap-1.5 shadow-sm">

        </div>

        <!-- Grid Section -->
        <div id="grid" class="grid gap-4">
            <!-- Skeleton Loaders -->
            <div class="skeleton-card bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-4 animate-pulse">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-200 rounded-xl"></div>
                        <div class="space-y-2">
                            <div class="w-20 h-4 bg-slate-200 rounded"></div>

                    </div>

                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="h-10 bg-slate-200 rounded-xl"></div>
                    <div class="h-10 bg-slate-200 rounded-xl"></div>
                </div>
            </div>
            <div class="skeleton-card bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-4 animate-pulse">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-200 rounded-xl"></div>
                        <div class="space-y-2">
                            <div class="w-24 h-4 bg-slate-200 rounded"></div>
                            <div class="w-16 h-3 bg-slate-200 rounded"></div>

                    </div>
                    <div class="w-16 h-6 bg-slate-200 rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="h-10 bg-slate-200 rounded-xl"></div>

        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-500 text-center animate-fade-in">
            <div class="relative mb-4">
                <div class="absolute inset-0 bg-primary-500/10 blur-2xl rounded-full"></div>
                <i class="fas fa-ghost text-5xl relative z-10 text-slate-400 drop-shadow-md"></i>
            </div>
            <h3 class="text-base font-bold text-slate-700 mb-1">سروری یافت نشد!</h3>
            <p class="text-xs text-slate-500 max-w-xs mb-5 leading-relaxed">کانفیگی با فیلتر یا عبارت مورد نظر شما در دیتابیس ۱۲ ساعت گذشته پیدا نشد.</p>
            <button onclick="resetFilters()" class="bg-slate-100 hover:bg-slate-200 text-primary-600 px-5 py-2 rounded-xl text-xs font-semibold border border-slate-200 transition-all active:scale-95 flex items-center gap-1.5">
                <i class="fas fa-arrow-rotate-left text-[10px]"></i> ریست کردن فیلترها
            </button>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white/80 backdrop-blur-xl border-t border-gray-200 pb-safe z-50">
        <div class="max-w-xl mx-auto grid grid-cols-3 h-16 relative">
            <div class="absolute -top-14 left-4">
                <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="bg-slate-50/60 hover:bg-primary-500 border border-slate-200 text-slate-700 hover:text-white w-10 h-10 rounded-full backdrop-blur flex items-center justify-center shadow-xl transition-all active:scale-90">

            <button onclick="fetchData()" class="group flex flex-col items-center justify-center text-slate-500 hover:text-primary-600 transition-colors">

                <span class="text-[10px] font-medium">بروزرسانی لایو</span>

            <a href="https://t.me/myvpn1404" target="_blank" class="flex flex-col items-center justify-center text-slate-500 hover:text-primary-600 transition-colors">

                    <i class="fab fa-telegram text-lg text-primary-600"></i>

            <a href="https://github.com/mostafa5804" target="_blank" class="flex flex-col items-center justify-center text-slate-500 hover:text-slate-900 transition-colors">

    <!-- QR Modal -->
    <div id="qrModal" class="fixed inset-0 z-[60] bg-black/50 backdrop-blur-md hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full mx-4 transform scale-95 transition-transform duration-300 shadow-2xl border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-slate-800 font-bold text-sm" id="qrModalTitle">اسکن کد QR</h3>
                <button onclick="closeQR()" class="text-slate-500 hover:text-slate-800 w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center transition-colors">
                    <i class="fas fa-times text-xs"></i>

            </div>
            <div class="bg-white p-3 rounded-xl flex justify-center overflow-hidden shadow-inner border border-slate-200">
                <div id="qrcode"></div>
            </div>
            <p class="text-center text-slate-500 text-[11px] mt-4 leading-relaxed" id="qrModalDesc">برای اتصال سریع، بارکد فوق را داخل نرم‌افزار اسکن کنید.</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-10 opacity-0 transition-all duration-300 z-[60]">
        <div class="bg-emerald-500/20 text-emerald-400 rounded-full w-6 h-6 flex items-center justify-center text-xs">
            <i class="fas fa-check"></i>
        </div>
        <span class="text-xs font-semibold" id="toastText">با موفقیت کپی شد!</span>
    </div>

    <script>
        let rawDatabase = { configs: [], proxies: [], files: [] };
        let activeFilterType = 'all';
        let activeSortType = 'date';
        const subscriptionLink = "https://raw.githubusercontent.com/mostafa5804/Myvpn1404/refs/heads/main/sub.txt";

        // Initial Initialization Lifecycle
        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
        });

        // Async Live API Fetch Data Implementation
        async function fetchData() {
            showSkeletons();
            try {
                const res = await fetch(`./data.json?t=${new Date().getTime()}`);
                if (!res.ok) throw new Error("Network status invalid");
                rawDatabase = await res.json();
                
                if (rawDatabase.configs && rawDatabase.configs.length > 0) {
                    const sampleTs = rawDatabase.configs[0].ts * 1000;
                    const dateObj = new Date(sampleTs);
                    document.getElementById('updateTime').innerText = dateObj.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }) + " - " + dateObj.toLocaleDateString('fa-IR');
                } else {
                    document.getElementById('updateTime').innerText = "بروزرسانی زنده فعال";
                }
                
                renderGrid();
            } catch (err) {
                console.error("Critical fetching issue:", err);
                document.getElementById('grid').innerHTML = `<p class="text-center text-rose-500 py-6 text-xs font-bold"><i class="fas fa-triangle-exclamation pl-1"></i>خطا در بارگذاری پایگاه داده زنده</p>`;
            }
        }

        function showSkeletons() {
            const grid = document.getElementById('grid');
            document.getElementById('emptyState').classList.add('hidden');
            grid.innerHTML = Array(3).fill(`
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-4 animate-pulse">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-slate-200 rounded-xl"></div>
                            <div class="space-y-2">
                                <div class="w-24 h-4 bg-slate-200 rounded"></div>
                                <div class="w-16 h-3 bg-slate-200 rounded"></div>
                            </div>
                        </div>
                        <div class="w-16 h-6 bg-slate-200 rounded-lg"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="h-10 bg-slate-200 rounded-xl"></div>
                        <div class="h-10 bg-slate-200 rounded-xl"></div>
                    </div>
                </div>
            `).join('');
        }

        // Filter Action Mutation Mutator
        function filterType(type, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            activeFilterType = type;
            renderGrid();
        }

        // Sort Action Mutation Mutator
        function changeSort(method, element) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            activeSortType = method;
            renderGrid();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            filterType('all', document.querySelector('.filter-btn'));
        }

        // Advanced Signal Strength Calculation Utility
        function generateSignalBars(latency) {
            let colorClass = "bg-rose-500";
            let activeBars = 1;
            
            if (latency < 180) {
                colorClass = "bg-emerald-500";
                activeBars = 3;
            } else if (latency < 450) {
                colorClass = "bg-yellow-500";
                activeBars = 2;
            }
            
            return `
                <div class="flex items-end gap-[2px] h-3.5 pb-0.5" title="پینگ: ${latency}ms">
                    <div class="w-1 h-1.5 ${activeBars >= 1 ? colorClass : 'bg-slate-300'} rounded-sm"></div>
                    <div class="w-1 h-2.5 ${activeBars >= 2 ? colorClass : 'bg-slate-300'} rounded-sm"></div>
                    <div class="w-1 h-3.5 ${activeBars >= 3 ? colorClass : 'bg-slate-300'} rounded-sm"></div>
                </div>
            `;
        }

        // Grid Compiler Rendering Pipeline Engine
        function renderGrid() {
            const grid = document.getElementById('grid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            let compiledItems = [];

            // Compile unified structure from split data architecture
            if (activeFilterType === 'all' || ['VLESS', 'VMESS', 'TROJAN'].includes(activeFilterType)) {
                let confs = (rawDatabase.configs || []).map(item => ({ ...item, masterType: 'config' }));
                if (activeFilterType !== 'all') {
                    confs = confs.filter(c => c.protocol.toUpperCase() === activeFilterType);
                }
                compiledItems = compiledItems.concat(confs);
            }

            if (activeFilterType === 'all' || activeFilterType === 'MTPROXY') {
                let proxies = (rawDatabase.proxies || []).map(item => ({ ...item, masterType: 'proxy', protocol: 'MTPROXY' }));
                compiledItems = compiledItems.concat(proxies);
            }

            if (activeFilterType === 'FILES') {
                let files = (rawDatabase.files || []).map(item => ({ ...item, masterType: 'file', protocol: item.ext }));
                compiledItems = compiledItems.concat(files);
            }

            // Text search algorithmic evaluation filter
            if (searchTerm) {
                compiledItems = compiledItems.filter(item => {
                    const country = (item.country || '').toLowerCase();
                    const protocol = (item.protocol || '').toLowerCase();
                    const channel = (item.channel || '').toLowerCase();
                    const name = (item.name || '').toLowerCase();
                    return country.includes(searchTerm) || protocol.includes(searchTerm) || channel.includes(searchTerm) || name.includes(searchTerm);
                });
            }

            // Advanced Sort engine integration
            if (activeSortType === 'date') {
                compiledItems.sort((a, b) => b.ts - a.ts);
            } else if (activeSortType === 'ping') {
                compiledItems.sort((a, b) => {
                    const pA = a.masterType === 'file' ? 9999 : parseInt(a.latency || 9999);
                    const pB = b.masterType === 'file' ? 9999 : parseInt(b.latency || 9999);
                    return pA - pB;
                });
            }

            if (compiledItems.length === 0) {
                grid.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            // Virtual mapping execution loop inside UI DOM
            grid.innerHTML = compiledItems.map((item, index) => {
                if (item.masterType === 'config') {
                    const lat = parseInt(item.latency || 999);
                    const pingColor = lat < 180 ? "text-emerald-600 bg-emerald-50 border-emerald-200" : lat < 450 ? "text-yellow-600 bg-yellow-50 border-yellow-200" : "text-rose-600 bg-rose-50 border-rose-200";
                    
                    return `
                        <div class="card group relative bg-white rounded-2xl p-4 border border-slate-200 hover:border-primary-300 transition-all duration-300 hover:shadow-lg overflow-hidden">
                            <div class="flex justify-between items-start mb-3.5">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl filter drop-shadow-md select-none">${item.flag || '🏳️'}</span>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="font-extrabold text-primary-600 text-xs tracking-wider">${item.protocol.toUpperCase()}</span>
                                            <span class="text-[9px] text-slate-500 border border-slate-200 rounded bg-slate-50 px-1 py-0.5 font-medium">${item.country || 'Global'}</span>
                                        </div>
                                        <div class="text-[10px] text-slate-500 mt-1 truncate max-w-[150px] font-medium"><i class="far fa-paper-plane pl-1 text-[9px]"></i>${item.channel}</div>
                                    </div>
                                </div>
                                <div class="text-[11px] font-mono font-bold ${pingColor} border px-2 py-1 rounded-lg flex items-center gap-1.5 shadow-sm">
                                    ${generateSignalBars(lat)}
                                    <span>${lat}ms</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="copyToClipboard('${escapeHtml(item.config)}')" class="col-span-1 bg-primary-600 hover:bg-primary-700 text-white py-2.5 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-1.5 shadow-md shadow-primary-500/20">
                                    <i class="fas fa-copy"></i> کپی کانفیگ
                                </button>
                                <button onclick="showIndividualQR('${escapeHtml(item.config)}', '${item.protocol}')" class="col-span-1 bg-slate-50 hover:bg-slate-100 text-slate-700 py-2.5 rounded-xl text-xs font-semibold transition-all flex justify-center items-center gap-1.5 border border-slate-200">
                                    <i class="fas fa-qrcode text-slate-500"></i> بارکد QR
                                </button>
                            </div>
                        </div>`;
                } else if (item.masterType === 'proxy') {
                    const lat = parseInt(item.latency || 999);
                    const pingColor = lat < 180 ? "text-emerald-600 bg-emerald-50 border-emerald-200" : lat < 450 ? "text-yellow-600 bg-yellow-50 border-yellow-200" : "text-rose-600 bg-rose-50 border-rose-200";
                    
                    return `
                        <div class="card group relative bg-white rounded-2xl p-4 border border-slate-200 hover:border-secondary-300 transition-all duration-300 hover:shadow-lg overflow-hidden">
                            <div class="flex justify-between items-start mb-3.5">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl filter drop-shadow-md select-none">${item.flag || '🏳️'}</span>
                                    <div>
                                        <div class="flex items-center gap-1.5">
                                            <span class="font-extrabold text-secondary-600 text-xs tracking-wider bg-secondary-50 border border-secondary-200 px-1.5 py-0.5 rounded">MTProxy</span>
                                        </div>
                                        <div class="text-[10px] text-slate-500 mt-1 truncate max-w-[150px] font-medium"><i class="far fa-paper-plane pl-1 text-[9px]"></i>${item.channel}</div>
                                    </div>
                                </div>
                                <div class="text-[11px] font-mono font-bold ${pingColor} border px-2 py-1 rounded-lg flex items-center gap-1.5 shadow-sm">
                                    ${generateSignalBars(lat)}
                                    <span>${lat}ms</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-1">
                                <a href="${item.link}" class="w-full bg-secondary-600 hover:bg-secondary-700 text-white py-2.5 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-1.5 shadow-md shadow-secondary-500/20">
                                    <i class="fas fa-paper-plane"></i> اتصال مستقیم به پروکسی تلگرام
                                </a>
                            </div>
                        </div>`;
                } else if (item.masterType === 'file') {
                    return `
                        <div class="card group relative bg-white rounded-2xl p-4 border border-slate-200 hover:border-indigo-300 transition-all duration-300 hover:shadow-lg overflow-hidden">
                            <div class="flex justify-between items-start mb-3.5">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-200 flex items-center justify-center text-indigo-600 text-lg shadow-sm">
                                        <i class="fas fa-file-code"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-800 line-clamp-1 max-w-[180px]">${item.name}</h4>
                                        <div class="text-[10px] text-slate-500 mt-1 truncate max-w-[150px] font-medium"><i class="far fa-paper-plane pl-1 text-[9px]"></i>${item.channel}</div>
                                    </div>
                                </div>
                                <span class="text-[9px] font-extrabold text-indigo-600 border border-indigo-200 bg-indigo-50 px-2 py-0.5 rounded">${item.protocol}</span>
                            </div>
                            <div class="grid grid-cols-1">
                                <a href="${item.link}" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold transition-all flex justify-center items-center gap-1.5 shadow-md shadow-indigo-500/20">
                                    <i class="fas fa-download"></i> دانلود فایل از منبع اصلی تلگرام
                                </a>
                            </div>
                        </div>`;
                }
            }).join('');
        }

        // Global Copy Clipboard Engine
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("کانفیگ با موفقیت کپی شد.");
            }).catch(err => {
                console.error("Copy failed", err);
            });
        }

        // Advanced Copy All Visible Strategy Filter Logic
        function copyAllVisible() {
            const cards = document.querySelectorAll('#grid .card');
            let accumulatedConfigs = [];
            
            const searchInput = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = (rawDatabase.configs || []);
            if (activeFilterType !== 'all' && ['VLESS', 'VMESS', 'TROJAN'].includes(activeFilterType)) {
                filtered = filtered.filter(c => c.protocol.toUpperCase() === activeFilterType);
            } else if (['MTPROXY', 'FILES'].includes(activeFilterType)) {
                filtered = [];
            }

            if (searchInput) {
                filtered = filtered.filter(item => {
                    return (item.country || '').toLowerCase().includes(searchInput) || 
                           (item.protocol || '').toLowerCase().includes(searchInput) || 
                           (item.channel || '').toLowerCase().includes(searchInput);
                });
            }

            if (filtered.length === 0) {
                showToast("کانفیگ معتبری برای کپی یافت نشد", true);
                return;
            }

            const payload = filtered.map(c => c.config).join('\n');
            navigator.clipboard.writeText(payload).then(() => {
                showToast(`${filtered.length} کانفیگ کپی شدند.`);
            });
        }

        // Toast Orchestration System
        function showToast(text, isWarning = false) {
            const t = document.getElementById('toast');
            const textEl = document.getElementById('toastText');
            textEl.innerText = text;
            
            t.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-10', 'opacity-0'), 2500);
        }

        // Dedicated QR Modal Management
        const modal = document.getElementById('qrModal');
        const modalContent = modal.querySelector('div');
        
        function openModalCore(title, desc, textToQr) {
            document.getElementById('qrModalTitle').innerText = title;
            document.getElementById('qrModalDesc').innerText = desc;
            document.getElementById('qrcode').innerHTML = "";
            
            new QRCode(document.getElementById("qrcode"), {
                text: textToQr,
                width: 200,
                height: 200,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 20);
        }

        function showIndividualQR(configStr, protocol) {
            openModalCore(`بارکد اتصال ${protocol}`, "برای اتصال مستقیم گوشی، بارکد فوق را داخل کلاینت خود اسکن کنید.", configStr);
        }

        function showSubQR() {
            openModalCore("بارکد کل لینک اشتراک", "آدرس سابسکریپشن کامل شما؛ بارکد فوق را اسکن کنید تا کل پایگاه داده به نرم‌افزار ایمپورت شود.", subscriptionLink);
        }

        function closeQR() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        
        modal.addEventListener('click', (e) => { if (e.target === modal) closeQR(); });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
